    # UniSSH sync server + admin panel, served at the root of https://$host/
    # Install as: /var/elliot/volumes/nginx/etc/nginx/elliot/location.d/unissh.conf
    # (included inside the existing :443 server block of conf.d/20-default.conf).
    #
    # UniSSH needs the domain root: the admin SPA is built for "/", and the
    # clients call /v1/*, /healthz and /readyz on the instance URL. Every other
    # location.d entry is a longer prefix, so it still wins over "location /".

    # API -> server directly, so it sees the real client IP for rate limiting.
    location /v1/ {
        set $proxy_url http://unissh-server:8443;
        proxy_pass $proxy_url;
        proxy_pass_header Authorization;
        include /etc/nginx/elliot/proxy-header.conf;
    }

    location ~ ^/(healthz|readyz)$ {
        set $proxy_url http://unissh-server:8443;
        proxy_pass $proxy_url;
        include /etc/nginx/elliot/proxy-header.conf;
    }

    # Admin SPA (and /join invite links) -> the stack's Caddy on plain HTTP.
    location / {
        set $proxy_url http://unissh-caddy:80;
        proxy_pass $proxy_url;
        include /etc/nginx/elliot/proxy-header.conf;
    }
