    # UniSSH sync server + admin panel, served under https://$host/unissh/
    # Install as: /var/elliot/volumes/nginx/etc/nginx/elliot/location.d/unissh.conf
    # (included inside the existing :443 server block of conf.d/20-default.conf).
    #
    # Instance URL for the clients and the admin panel: https://<host>/unissh
    # The containers serve at their own root, so the /unissh prefix is stripped
    # here. The panel is built with a relative base and the clients append /v1/…
    # to the instance URL, so neither needs to know about the prefix.

    # API -> server directly, so it sees the real client IP for rate limiting.
    # `set` must precede the rewrite: `break` ends the rewrite phase.
    location ~ ^/unissh/(v1/|healthz$|readyz$) {
        set $proxy_url http://unissh-server:8443;
        rewrite ^/unissh/(.*)$ /$1 break;
        proxy_pass $proxy_url;
        proxy_pass_header Authorization;
        include /etc/nginx/elliot/proxy-header.conf;
    }

    # Admin panel (and /unissh/join invite links) -> the stack's Caddy, plain HTTP.
    location /unissh/ {
        set $proxy_url http://unissh-caddy:80;
        rewrite ^/unissh/(.*)$ /$1 break;
        proxy_pass $proxy_url;
        include /etc/nginx/elliot/proxy-header.conf;
    }

    location = /unissh {
        return 301 https://$host/unissh/;
    }
